  "/target/",
  "**/*.rs.bk",
  "**/*.rmeta",
  "/cov/html/",
  "/report/",
  "/metrics/",
  "/mutants.out/",
  "/mutants.out.old/",
  "**/*.bk",
  "Cargo.lock",
  ".idea/",
  ".vscode/",
  "*.swp",
  "*.swo",

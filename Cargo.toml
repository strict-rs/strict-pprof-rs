[workspace]
members = [".","xtask"]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.96.1"  # MSRV
license = "Apache-2.0"
license-file = "LICENSE"
publish      = false
authors      = ["Yang Keao <keao.yang@yahoo.com>", "Takumi Shimada <hello@takumi.earth>"]
repository = "https://github.com/strict-rs/strict-pprof-rs"
readme       = "README.md"

[package]
name = "pprof"
version = "0.16.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "An internal perf tools for rust programs."
repository.workspace = true
documentation = "https://github.com/strict-rs/strict-pprof-rs"
readme.workspace = true
rust-version.workspace = true
keywords = ["cpu", "flamegraph", "pprof", "profiler", "profiling"]
categories = ["development-tools::profiling"]

[features]
default = ["cpp"]
cpp = ["symbolic-demangle/cpp"]
flamegraph = ["svg"]
frame-pointer = []

# A private feature to indicate either prost-codec or protobuf-codec is enabled.
_protobuf = []
prost-codec = ["prost", "prost-build", "sha2", "_protobuf"]
protobuf-codec = ["protobuf", "protobuf-codegen", "_protobuf"]
framehop-unwinder = ["framehop", "memmap2", "object"]
perfmaps = ["arc-swap"]
large-depth = []
huge-depth = []

[dependencies]
backtrace = { workspace = true }
once_cell = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
nix = { workspace = true, default-features = false, features = ["signal", "fs"] }
spin = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
findshlibs = { workspace = true }
cfg-if = { workspace = true }
smallvec = { workspace = true }

chrono = { workspace = true }
svg = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
protobuf = { workspace = true, optional = true }
criterion = { workspace = true, optional = true}
aligned-vec = { workspace = true }

# framehop unwinder dependencies
framehop = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
object = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }

symbolic-demangle = { workspace = true, default-features = false, features = ["rust"] }

[dev-dependencies]
criterion = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }
strict-test-support = { workspace = true }

[build-dependencies]
prost-build = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
protobuf-codegen = { workspace = true, optional = true }
thiserror = { workspace = true }

[[example]]
name = "flamegraph"
required-features = ["flamegraph"]

[[example]]
name = "profile_proto_with_prost"
required-features = ["protobuf", "prost-codec"]

[[example]]
name = "profile_proto_with_protobuf_codec"
required-features = ["protobuf", "protobuf-codec"]

[[example]]
name = "multithread_flamegraph"
required-features = ["flamegraph"]

[[example]]
name = "backtrace_while_sampling"
required-features = ["flamegraph"]

[[example]]
name = "criterion"
required-features = ["flamegraph", "criterion"]

[[bench]]
name = "collector"
path = "benches/collector.rs"
harness = false

[[bench]]
name = "addr_validate"
path = "benches/addr_validate.rs"
harness = false

[package.metadata.docs.rs]
all-features = true

[workspace.dependencies]
backtrace = "0.3"

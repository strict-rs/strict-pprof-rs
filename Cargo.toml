mixed_read_write_in_expression           = "deny"
str_to_string                            = "deny"
string_add                               = "deny"
format_push_string                       = "deny"
or_fun_call                              = "deny"
suboptimal_flops                         = "deny"
suspicious_operation_groupings           = "deny"

# Shadowing / naming / similarity traps
shadow_unrelated                         = "deny"
shadow_reuse                             = "deny"
shadow_same                              = "deny"
similar_names                            = "deny"
min_ident_chars                          = "deny"
self_named_constructors                  = "deny"

# Scoping / import hygiene
wildcard_imports                         = "deny"
enum_glob_use                            = "deny"
exit                                     = "deny"
create_dir                               = "deny"
partial_pub_fields                       = "deny"
multiple_inherent_impl                   = "deny"
tests_outside_test_module                = "deny"

# Cargo hygiene individuals
wildcard_dependencies                    = "deny"
multiple_crate_versions                  = "deny"
negative_feature_names                   = "deny"
redundant_feature_names                  = "deny"
cargo_common_metadata                    = "deny"

# Forbid silently discarding must-use values
let_underscore_must_use                  = "deny"
let_underscore_untyped                   = "deny"
let_underscore_future                    = "deny"

# Bool-flag smells
fn_params_excessive_bools                = "deny"
struct_excessive_bools                   = "deny"

# Large things hiding copy-paste
large_enum_variant                       = "deny"
large_stack_arrays                       = "deny"
large_stack_frames                       = "deny"
large_types_passed_by_value              = "deny"
large_include_file                       = "deny"
large_digit_groups                       = "deny"

# Formatting / macro hygiene
uninlined_format_args                    = "deny"
nonstandard_macro_braces                 = "deny"

# Range / time / iter pitfalls
range_minus_one                          = "deny"
range_plus_one                           = "deny"
path_buf_push_overwrite                  = "deny"
iter_on_empty_collections                = "deny"
iter_on_single_items                     = "deny"
naive_bytecount                          = "deny"
no_effect_underscore_binding             = "deny"

# Identifier confusables / unicode hazards
disallowed_script_idents                 = "deny"
unicode_not_nfc                          = "deny"

# Infinite / runaway loops
infinite_loop                            = "deny"

# Document private items too so internal invariants and rationale stay visible.
missing_docs_in_private_items            = "deny"

# Meta: localized `#[allow(clippy::single_call_fn, reason = "...")]` is
# permitted where a named helper genuinely improves structure. The companion
# `lint-attrs` xtask still rejects every other `#[allow(...)]` / `#[expect(...)]`.
allow_attributes                         = "allow"
allow_attributes_without_reason          = "deny"

# Branching should usually read as a decision with a clear shape: guard clauses
# for fast exits, `match` for exhaustive cases, or a helper when the decision
# deserves a name.
#
# This warning catches long, open-ended `else if` ladders that tend to hide
# missing cases, duplicate work, or control flow that wants to be modelled more
# directly. It stays at `warn` because a short chain can still be the clearest
# expression in local context.
else_if_without_else                     = "warn"

# Extract helpers when the name teaches the reader something important:
# capturing a domain rule, isolating validation, ending a borrow before
# `.await`, or turning a dense branch into a readable step.
#
# This warning exists to catch the opposite pattern: one-off wrappers that only
# shuffle code around and make the call graph noisier without adding meaning.
# It stays at `warn` because a genuinely clarifying helper is still the right
# move, even if it currently has a single caller.
single_call_fn                           = "warn"

# ─────────────────────────────────────────────────────────────────────────
# Intentional `allow`s — these contradict lints we've denied above, or fight
# idiomatic Rust 2024. Leaving them at `allow` is a conscious choice.
# ─────────────────────────────────────────────────────────────────────────
implicit_return                          = "allow"   # contradicts trailing-expr idiom
self_named_module_files                  = "allow"   # contradicts mod_module_files
semicolon_inside_block                   = "allow"   # contradicts semicolon_outside_block
separated_literal_suffix                 = "allow"   # contradicts unseparated_literal_suffix
question_mark_used                       = "allow"   # `?` is idiomatic
pub_use                                  = "allow"   # re-export idiom
ref_binding_to_reference                 = "allow"   # contradicts pattern_type_mismatch
blanket_clippy_restriction_lints         = "allow"   # we intentionally enable restriction individually


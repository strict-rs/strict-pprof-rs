[workspace]
members = [".","xtask"]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.96.1"  # MSRV
license = "Apache-2.0"
license-file = "LICENSE"
publish      = false
authors      = ["Yang Keao <keao.yang@yahoo.com>", "Takumi Shimada <hello@takumi.earth>"]
repository = "https://github.com/strict-rs/strict-pprof-rs"
readme       = "README.md"

[package]
name = "pprof"
version = "0.16.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "An internal perf tools for rust programs."
repository.workspace = true
documentation = "https://github.com/strict-rs/strict-pprof-rs"
readme.workspace = true
rust-version.workspace = true

[features]
default = ["cpp"]
cpp = ["symbolic-demangle/cpp"]
flamegraph = ["inferno"]
frame-pointer = []

# A private feature to indicate either prost-codec or protobuf-codec is enabled.
_protobuf = []
prost-codec = ["prost", "prost-derive", "prost-build", "sha2", "_protobuf"]
protobuf-codec = ["protobuf", "protobuf-codegen", "_protobuf"]
framehop-unwinder = ["framehop", "memmap2", "object"]
perfmaps = ["arc-swap"]
large-depth = []
huge-depth = []

[dependencies]
backtrace = { workspace = true }
once_cell = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
nix = { workspace = true, default-features = false, features = ["signal", "fs"] }
spin = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
findshlibs = { workspace = true }
cfg-if = { workspace = true }
smallvec = { workspace = true }

inferno = { workspace = true, default-features = false, features = ["nameattr"], optional = true }
prost = { workspace = true, optional = true }
prost-derive = { workspace = true, optional = true }
protobuf = { workspace = true, optional = true }
criterion = { workspace = true, optional = true}
aligned-vec = { workspace = true }

# framehop unwinder dependencies
framehop = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
object = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }

symbolic-demangle = { workspace = true, default-features = false, features = ["rust"] }

[dev-dependencies]
criterion = { workspace = true }
rand = { workspace = true }

[build-dependencies]
prost-build = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
protobuf-codegen = { workspace = true, optional = true }

[[example]]
name = "flamegraph"
required-features = ["flamegraph"]

[[example]]
name = "profile_proto_with_prost"
required-features = ["protobuf", "prost-codec"]

[[example]]
name = "profile_proto_with_protobuf_codec"
required-features = ["protobuf", "protobuf-codec"]

[[example]]
name = "multithread_flamegraph"
required-features = ["flamegraph"]

[[example]]
name = "backtrace_while_sampling"
required-features = ["flamegraph"]

[[example]]
name = "criterion"
required-features = ["flamegraph", "criterion"]

[[bench]]
name = "collector"
path = "benches/collector.rs"
harness = false

[[bench]]
name = "addr_validate"
path = "benches/addr_validate.rs"
harness = false

[package.metadata.docs.rs]
all-features = true

[workspace.dependencies]
backtrace = "0.3"
once_cell = "1.21"
libc = "0.2.186"
log = "0.4"
nix = { version = "0.31", default-features = false }
spin = "0.12"
tempfile = "3.27"
thiserror = "2.0"
findshlibs = "0.10"
cfg-if = "1.0"
smallvec = "1.15"
inferno = { version = "0.12", default-features = false }
prost = "0.14"
prost-derive = "0.14"
protobuf = "3.7.2"
criterion = "0.8"
aligned-vec = "0.6"
framehop = "0.16"
memmap2 = "0.9.11"
object = "0.39.1"
arc-swap = "1.9.2"
symbolic-demangle = { version = "13.8", default-features = false }
rand = "0.10.2"
prost-build = "0.14"
sha2 = "0.11"
protobuf-codegen = "3.7.2"

agents-md = { version = "0.1.0", git = "ssh://git@github.com/earthlings-dev/agents-md-rs.git", branch = "main" }
bpaf = { git = "ssh://git@github.com/strict-rs/strict-bpaf.git", branch = "sync", version = "0.10", default-features = false }

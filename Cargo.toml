syn         = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
cargo_metadata = "0.23"
ignore = "0.4"
toml_edit = "0.25"
anstyle = "1"
snapbox = { version = "1.2", features = ["diff"], default-features = false }

